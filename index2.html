<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PACU恢復室藥物學習平台</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Microsoft JhengHei",sans-serif;
background:#f3f7fb;
}

header{
background:#2B5C98;
color:white;
text-align:center;
padding:40px 20px;
}

header h1{
font-size:40px;
margin-bottom:10px;
}

header p{
font-size:18px;
}

.grid{
max-width:1200px;
margin:auto;
padding:25px;

display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
min-height:220px;

box-shadow:0 4px 12px rgba(0,0,0,.08);

transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
color:#2B5C98;
font-size:28px;
margin-bottom:20px;
}

.card p{
font-size:18px;
line-height:1.8;
}
