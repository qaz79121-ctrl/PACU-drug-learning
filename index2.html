<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PACU恢復室藥物學習平台</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f3f7fb;
}

header{
    background:#2B5C98;
    color:white;
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:42px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
}

.grid{
    max-width:1200px;
    margin:auto;
    padding:25px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    min-height:220px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

    transition:.3s;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#2B5C98;
    font-size:30px;
    margin-bottom:20px;
}

.card p{
    font-size:20px;
    line-height:1.8;
}

.video-btn{

    display:inline-block;
    background:#2B5C98;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    margin-bottom:8px;

}

.video-btn:hover{
    background:#1F487A;
}

.footer{
    text-align:center;
    padding:30px;
    color:#666;
    font-size:14px;
}

@media(max-width:768px){

.grid{
    grid-template-columns:1fr;
}

header h1{
    font-size:30px;
}

.card h2{
    font-size:26px;
}

.card p
