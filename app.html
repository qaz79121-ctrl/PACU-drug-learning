<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恢復室藥物快查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F1;
  --panel:#FFFFFF;
  --panel-2:#F4F7F6;
  --ink:#0F2C29;
  --ink-soft:#4B6360;
  --ink-faint:#7C918D;
  --hairline:#DCE6E3;
  --teal:#0E6E63;
  --teal-deep:#0A4F47;
  --teal-tint:#E1F0EC;
  --high:#B3271A;
  --high-tint:#FBE9E6;
  --medium:#9A6B0A;
  --medium-tint:#FBF1DE;
  --gold:#C7962E;
  --shadow:0 1px 2px rgba(15,44,41,.06), 0 8px 20px -12px rgba(15,44,41,.18);
  --radius:16px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1817;
    --panel:#122522;
    --panel-2:#0F2020;
    --ink:#EAF3F1;
    --ink-soft:#A9C2BE;
    --ink-faint:#77938E;
    --hairline:#1E3A36;
    --teal:#3FBFA9;
    --teal-deep:#7FE0CC;
    --teal-tint:#123531;
    --high:#F0938A;
    --high-tint:#331813;
    --medium:#E6BE6E;
    --medium-tint:#332608;
    --gold:#E6BE6E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1817;
  --panel:#122522;
  --panel-2:#0F2020;
  --ink:#EAF3F1;
  --ink-soft:#A9C2BE;
  --ink-faint:#77938E;
  --hairline:#1E3A36;
  --teal:#3FBFA9;
  --teal-deep:#7FE0CC;
  --teal-tint:#123531;
  --high:#F0938A;
  --high-tint:#331813;
  --medium:#E6BE6E;
  --medium-tint:#332608;
  --gold:#E6BE6E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:var(--sans);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
}

/* ===== App shell ===== */
.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}

/* -- Top bar -- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--teal-deep);
  color:#F4FBF9;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  border:1px solid rgba(255,255,255,.18);
}
.brand-text h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;}
.brand-text p{margin:1px 0 0;font-size:11.5px;color:rgba(244,251,249,.68);}
.count-pill{
  font-family:var(--mono);
  font-size:12px;font-weight:600;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);
  color:#F4FBF9;
  padding:5px 10px;border-radius:999px;
  white-space:nowrap;
}

.search-wrap{margin-top:12px;position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.65;}
.search-input{
  width:100%;
  padding:11px 14px 11px 38px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.1);
  color:#F4FBF9;
  font-size:14.5px;
  font-family:var(--sans);
  outline:none;
}
.search-input::placeholder{color:rgba(244,251,249,.55);}
.search-input:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);}

/* -- Filter chips -- */
.chiprow{
  display:flex;flex-wrap:wrap;gap:7px;padding:10px 18px 2px;
}
.chip{
  flex:0 0 auto;
  padding:7px 13px;
  border-radius:999px;
  border:1px solid var(--hairline);
  background:var(--panel);
  color:var(--ink-soft);
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s;
}
.chip.active{
  background:var(--teal);
  border-color:var(--teal);
  color:#fff;
}
.chip.risk-high-chip.active{background:var(--high);border-color:var(--high);}
.chip.risk-medium-chip.active{background:var(--medium);border-color:var(--medium);}

/* -- Segmented tabs (全部/收藏) -- */
.segtabs{
  display:flex;gap:6px;margin:10px 18px 2px;
  background:var(--panel-2);
  padding:4px;border-radius:12px;
  border:1px solid var(--hairline);
}
.segtab{
  flex:1;text-align:center;padding:8px 6px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--ink-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.segtab.active{background:var(--panel);color:var(--teal-deep);box-shadow:var(--shadow);}

/* -- List -- */
.list{padding:14px 14px 96px;display:flex;flex-direction:column;gap:10px;flex:1;}

.card{
  background:var(--panel);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--hairline);
  overflow:hidden;
  position:relative;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--riskcolor);
}
.card-head{
  padding:13px 14px 13px 18px;
  display:flex;align-items:flex-start;gap:10px;
  cursor:pointer;
}
.card-head-main{flex:1;min-width:0;}
.card-name{
  font-size:15px;font-weight:700;color:var(--ink);
  line-height:1.35;
  word-break:break-word;
}
.card-meta{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px;
}
.badge{
  font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;
  display:inline-flex;align-items:center;gap:3px;
}
.badge-cat{background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--hairline);}
.badge-risk-high{background:var(--high-tint);color:var(--high);}
.badge-risk-medium{background:var(--medium-tint);color:var(--medium);}
.card-indication{
  margin:7px 0 0;font-size:12.5px;color:var(--ink-faint);line-height:1.5;
}
.card-indication.clamp{
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.card-side{display:flex;flex-direction:column;align-items:center;gap:6px;}
.fav-btn{
  background:none;border:none;font-size:18px;cursor:pointer;line-height:1;
  color:var(--ink-faint);padding:2px;
}
.fav-btn.active{color:var(--gold);}
.chev{
  font-size:11px;color:var(--ink-faint);transition:transform .2s;
}
.card.open .chev{transform:rotate(180deg);}

.card-body{
  max-height:0;overflow:hidden;
  transition:max-height .28s ease;
}
.card.open .card-body{max-height:1400px;}
.card-body-inner{padding:0 16px 16px 18px;}

.lowdose{
  background:var(--teal-tint);
  border:1px solid color-mix(in srgb, var(--teal) 25%, transparent);
  border-radius:10px;
  padding:9px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:11px;
}
.lowdose-label{font-size:11px;color:var(--teal-deep);font-weight:600;}
.lowdose-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--teal-deep);text-align:right;}
.lowdose-val.na{font-family:var(--sans);font-weight:500;color:var(--ink-faint);font-style:italic;font-size:11.5px;}

.sec{margin-bottom:11px;}
.sec:last-child{margin-bottom:0;}
.sec-label{
  font-size:10.5px;font-weight:700;letter-spacing:.3px;color:var(--ink-faint);
  margin-bottom:5px;
}
.sec-text{font-size:13px;line-height:1.6;color:var(--ink-soft);white-space:pre-line;}

.adr-box{
  background:var(--high-tint);border-radius:10px;padding:10px 12px;
}
.adr-box .sec-label{color:var(--high);}
.adr-box .sec-text{color:var(--high);}

.warn-list{background:var(--medium-tint);border-radius:10px;padding:10px 12px;}
.warn-list .sec-label{color:var(--medium);}
.warn-list ul{margin:0;padding:0;list-style:none;}
.warn-list li{
  font-size:12.5px;line-height:1.55;color:var(--medium);
  padding-left:14px;position:relative;margin-bottom:5px;
}
.warn-list li:last-child{margin-bottom:0;}
.warn-list li::before{content:"▲";position:absolute;left:0;top:1px;font-size:8px;}

.empty{
  text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:14px;line-height:1.7;
}
.empty-emoji{font-size:34px;display:block;margin-bottom:10px;}

/* -- Bottom tab bar -- */
.tabbar{
  position:sticky;bottom:0;z-index:30;
  background:var(--panel);
  border-top:1px solid var(--hairline);
  display:flex;
  padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  box-shadow:0 -6px 18px -14px rgba(15,44,41,.35);
}
.tabitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:10px;cursor:pointer;color:var(--ink-faint);
}
.tabitem .ic{font-size:18px;}
.tabitem .lb{font-size:10.5px;font-weight:600;}
.tabitem.active{color:var(--teal);}

::-webkit-scrollbar{width:0;height:0;}
  .back-home{
padding:20px;
text-align:center;
}

.back-home a{
display:inline-block;
background:#0E6E63;
color:white;
padding:14px 28px;
border-radius:14px;
text-decoration:none;
font-weight:700;
box-shadow:0 4px 12px rgba(0,0,0,.12);
transition:.2s;
}

.back-home a:hover{
background:#0A4F47;
}
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">🧰</div>
        <div class="brand-text">
          <h1>恢復室藥物快查</h1>
          <p>PACU Drug Quick Reference</p>

  <div class="list" id="list"></div>

<a href="index.html">

</div>

const categories = ["全部","止痛藥物","鎮靜藥物","急救藥物","心血管藥物","呼吸道藥物","止吐藥物","類固醇藥物","抗組織胺藥物","抗凝血藥物","利尿劑"];

/* ================= STATE ================= */
let state = {
  keyword:"",
  category:"全部",
  risk:"all",
  view:"all", // all | fav
  openIndex: new Set()
};

function escapeHtml(str){
  if(str===null||str===undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ================= FAVORITES (per-device, local only) ================= */
const FAV_KEY = "pacu_drug_favs_v1";
function loadFavs(){
  try{
    const raw = localStorage.getItem(FAV_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveFavs(set){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }catch(e){}
}
let favs = loadFavs();

/* ================= RENDER: chips ================= */
function renderChips(){
  const catEl = document.getElementById("catChips");
  catEl.innerHTML = categories.map(c=>
    `<div class="chip ${state.category===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`
  ).join("");
  catEl.querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click", ()=>{ state.category = el.dataset.cat; render(); });
  });

  const riskEl = document.getElementById("riskChips");
  const riskDefs = [
    {key:"all", label:"全部風險", cls:""},
    {key:"high", label:"🚨 高風險", cls:"risk-high-chip"},
    {key:"medium", label:"⚠️ 注意", cls:"risk-medium-chip"}
  ];
  riskEl.innerHTML = riskDefs.map(r=>
    `<div class="chip ${r.cls} ${state.risk===r.key?'active':''}" data-risk="${r.key}">${r.label}</div>`
  ).join("");
  riskEl.querySelectorAll(".chip").forEach(el=>{
    el.addEventListener("click", ()=>{ state.risk = el.dataset.risk; render(); });
  });
}

function setViewMode(mode){
  state.view = mode;
  document.getElementById("tabAll").classList.toggle("active", mode==="all");
  document.getElementById("tabFav").classList.toggle("active", mode==="fav");
  render();
}

/* ================= RENDER: list ================= */
function matchDrug(d, idx){
  if(state.view==="fav" && !favs.has(idx)) return false;
  if(state.category!=="全部" && d.category!==state.category) return false;
  if(state.risk!=="all" && d.risk!==state.risk) return false;
  if(state.keyword){
    const hay = (d.name+d.indication+d.adr.join(" ")+d.dose+d.warning.join(" ")).toLowerCase();
    if(!hay.includes(state.keyword)) return false;
  }
  return true;
}

function lowDoseIsNA(v){
  return v && (v.includes("無法換算") || v.includes("不適用") || v.includes("無固定濃度"));
}

function render(){
  renderChips();
  const listEl = document.getElementById("list");
  let html = "";
  let shown = 0;

  drugs.forEach((d, idx)=>{
    if(!matchDrug(d, idx)) return;
    shown++;
    const isOpen = state.openIndex.has(idx);
    const isFav = favs.has(idx);
    const riskColor = d.risk==="high" ? "var(--high)" : "var(--medium)";
    const riskBadge = d.risk==="high"
      ? `<span class="badge badge-risk-high">🚨 高風險</span>`
      : `<span class="badge badge-risk-medium">⚠️ 注意</span>`;
    const naClass = lowDoseIsNA(d.lowDoseConc) ? "na" : "";
    const lowDoseText = d.lowDoseConc ? escapeHtml(d.lowDoseConc) : "未提供";

    html += `
    <div class="card ${isOpen?'open':''}" style="--riskcolor:${riskColor}">
      <div class="card-head" data-idx="${idx}">
        <div class="card-head-main">
          <div class="card-name">${escapeHtml(d.name)}</div>
          <div class="card-meta">
            <span class="badge badge-cat">${escapeHtml(d.category)}</span>
            ${riskBadge}
          </div>
          <div class="card-indication ${isOpen?'':'clamp'}">${escapeHtml(d.indication)}</div>
        </div>
        <div class="card-side">
          <button class="fav-btn ${isFav?'active':''}" data-fav="${idx}" aria-label="收藏">${isFav?'★':'☆'}</button>
          <div class="chev">▾</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <div class="lowdose">
            <span class="lowdose-label">低劑量濃度（不稀釋）</span>
            <span class="lowdose-val ${naClass}">${lowDoseText}</span>
          </div>
          <div class="sec adr-box">
            <div class="sec-label">副作用</div>
            <div class="sec-text">${d.adr.map(escapeHtml).join("、")}</div>
          </div>
          <div class="sec">
            <div class="sec-label" style="color:var(--ink-faint);">用藥方式</div>
            <div class="sec-text">${escapeHtml(d.dose)}</div>
          </div>
          <div class="sec warn-list">
            <div class="sec-label">注意事項</div>
            <ul>${d.warning.map(w=>`<li>${escapeHtml(w)}</li>`).join("")}</ul>
          </div>
        </div>
      </div>
    </div>`;
  });

  if(shown===0){
    const msg = state.view==="fav"
      ? "尚未收藏任何藥物<br>點卡片右上角 ☆ 即可加入收藏"
      : "查無符合條件的藥物<br>請調整搜尋字詞或篩選條件";
    html = `<div class="empty"><span class="empty-emoji">😶‍🌫️</span>${msg}</div>`;
  }

  listEl.innerHTML = html;
  document.getElementById("countPill").textContent = shown + " 項";

  listEl.querySelectorAll(".card-head").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.closest(".fav-btn")) return;
      const idx = Number(el.dataset.idx);
      if(state.openIndex.has(idx)) state.openIndex.delete(idx);
      else state.openIndex.add(idx);
      render();
    });
  });
  listEl.querySelectorAll(".fav-btn").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const idx = Number(el.dataset.fav);
      if(favs.has(idx)) favs.delete(idx); else favs.add(idx);
      saveFavs(favs);
      render();
    });
  });
}

document.getElementById("search").addEventListener("input", (e)=>{
  state.keyword = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById("countPill").textContent = drugs.length + " 項";
render();
</script>
</body>
</html>
